[project]
name = "visualcut"
version = "0.1.0"
description = "Framegenaue Schnittvorschläge für Rohvideo (Talking-Head, Tutorial, Podcast) für DaVinci Resolve"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "opentimelineio>=0.17",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "rapidfuzz>=3.9",
    "otio-fcpx-xml-adapter>=1.0",
    "otio-cmx3600-adapter>=1.0",
]

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.1",
    "whisperx>=3.3",
    "torch>=2.6",
    "torchaudio>=2.6",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "lxml>=5",
]

[project.scripts]
visualcut = "visualcut.cli:app"
visualcut-mcp = "visualcut.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualcut"]

[tool.uv]
# torch/torchaudio mit CUDA 12.8 von der PyTorch-Index-URL
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
